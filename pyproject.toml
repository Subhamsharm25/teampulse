[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "teampulse"
version = "0.1.0"
description = "Daily hours, attendance and utilization dashboard for small startup teams"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Subham Sharma" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "itsdangerous>=2.2",       # signed session cookies
  "python-multipart>=0.0.9", # HTML form posts
  "tzdata>=2024.1",          # time zone database on Windows / slim images
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
teampulse = "teampulse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teampulse = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
